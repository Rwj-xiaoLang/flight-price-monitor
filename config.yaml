# 机票价格监控
routes:
  - from: CAN
    from_name: 广州
    to: NKG
    to_name: 南京
    dates:
      - "2026-11-25"
      - "2026-11-29"
    alert_threshold: 0        # 0 = 不启用价格提醒

platforms:
  - fliggy

schedule:
  interval_minutes: 90
  jitter_minutes: 30
  run_on_start: true

crawler:
  headless: true
  timeout_seconds: 45
  delay_min: 8
  delay_max: 18
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  mobile_user_agent: ""
  debug: true
  debug_dir: debug
  user_data_dir: user_data

output:
  db_path: data/prices.db
  log_path: logs/monitor.log

notifier:
  push_drop_min: 30
  push_rise_min: 50
  serverchan:
    enabled: false
    send_key: ""
    channel: ""
